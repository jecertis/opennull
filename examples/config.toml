# Sample opennull configuration. Copy into your project root as
# `config.toml`. API keys are never written here — each provider names an
# environment variable (process environment wins over a local `.env` file).

[general]
default_hint = "default"

[providers.anthropic_primary]
kind = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

# Any OpenAI-compatible endpoint works through the same neutral chat
# interface — e.g. Ollama's OpenAI shim, vLLM, OpenRouter:
[providers.local_openai]
kind = "openai_compat"
base_url = "http://localhost:11434/v1"
api_key_env = "OPENAI_COMPAT_API_KEY"

[[routes]]
hint = "default"
provider = "anthropic_primary"
model = "claude-sonnet-5"
tool_calling = true

[[routes]]
hint = "local"
provider = "local_openai"
model = "llama3.1"
tool_calling = true

# Optional deterministic per-prompt routing. Direct read-only requests use
# fast_hint; code changes and complex requests use powerful_hint. If either
# route is absent, opennull falls back to general.default_hint.
[harness]
fast_hint = "local"
powerful_hint = "default"
# Optional LinearOne n-gram model (.l1ng) that replaces the keyword rules.
# Not yet confirmed on opennull prompts, so leave it unset for now. If the
# file is missing or invalid, opennull warns and uses the keyword router.
# router_model = "router.l1ng"

[sandbox]
allow = []

# Local decision log in LinearOne's event format v1, for training better
# routers and edit guards. Off by default; nothing leaves the machine.
# Writes <workspace>/.opennull/events.jsonl (keep .opennull/ out of git).
# [telemetry]
# local_events = true
# record_text = false   # true also stores the tool call text (needed for training)
